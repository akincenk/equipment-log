[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equipment-log"
version = "0.1.0.dev0"
description = "Pre-use checks, scheduled maintenance and out-of-service flags for shared equipment, in a small web app."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cenk Akin" }]
dependencies = [
    "fastapi>=0.120",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38",
]

[project.optional-dependencies]
dev = ["httpx2>=2.16", "pytest>=8", "ruff>=0.6"]

[project.scripts]
equipment-log = "equipment_log.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
